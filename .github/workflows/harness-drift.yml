# Monthly drift check: do the real coding CLIs still satisfy the job contract?
#
# The pull-request gate (e2e-foreign-repo) runs the same end-to-end path with a
# shell one-liner standing in for the harness, which answers "did we break
# Fleet". It cannot answer "did a harness change under us", and that failure
# mode is real and silent: within one week of writing these rows, codex needed
# an API key rather than a ChatGPT sign-in, opencode's default model became one
# a valid key could not reach, and an npm package name was simply wrong. None
# of that is visible without running the actual CLIs against real models.
#
# So this one spends tokens, deliberately, on a schedule rather than per merge.
# It is a detector, not a gate — nothing waits on it, and a red result means
# "go look at that harness", not "the branch is broken".
#
# Secrets, all four required; the job skips cleanly without them:
#   FLEET_TARGET_REPO_URL             https URL of the target repository
#   FLEET_TARGET_REPO_TOKEN            token that can clone it and push branches
#   CLAUDE_CODE_OAUTH_TOKEN   claude-code credential
#   OPENAI_API_KEY            codex, opencode and omp all read this
name: harness-drift

on:
  schedule:
    # 06:00 UTC on the 1st. Monthly because these CLIs ship weekly but rarely
    # break their headless contract, and every run costs real money.
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    # Four image builds plus four live jobs. Generous: a bound that trips on a
    # healthy run would make the report useless.
    timeout-minutes: 90
    env:
      HAS_SECRETS: ${{ secrets.FLEET_TARGET_REPO_URL }}${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - if: env.HAS_SECRETS == ''
        run: echo "::notice title=Skipped::Harness credentials are not configured; the drift check did not run."

      - if: env.HAS_SECRETS != ''
        run: |
          git config --global user.name fleet-ci
          git config --global user.email ci@example.com

      # One image per harness. Built here rather than cached because a stale
      # image is exactly the drift this job exists to find.
      - if: env.HAS_SECRETS != ''
        run: |
          for cli in claude-code codex opencode omp; do
            echo "::group::build $cli"
            docker build \
              --build-arg "HARNESS_CLI=$cli" \
              --build-arg HARNESS_VERSION=latest \
              -t "fleet-runner:$cli-latest" \
              -f images/runner/Dockerfile .
            echo "::endgroup::"
          done

      # Every row, including the stub — if the stub fails here the finding is
      # about Fleet rather than about any harness, and that is worth knowing
      # before reading four harness failures.
      - if: env.HAS_SECRETS != ''
        env:
          FLEET_TARGET_REPO_URL: ${{ secrets.FLEET_TARGET_REPO_URL }}
          GH_TOKEN: ${{ secrets.FLEET_TARGET_REPO_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Linux has no host.docker.internal; without this every job sits at
          # `queued` until the deadline with nothing to say why.
          FLEET_DOCKER_HOST_ADDR: 172.17.0.1
        run: node --test test/e2e-foreign-repo.test.ts

      - if: failure() && env.HAS_SECRETS != ''
        run: |
          echo "::warning title=Harness drift::A harness row failed. Check whether the CLI changed its flags, its default model, or its auth before assuming Fleet broke — every failure of this kind so far has been the former."
