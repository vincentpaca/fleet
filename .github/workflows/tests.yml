# CI for every PR and for main. Two jobs:
#   test      — the full node --test suite, including the sanitized, packaging,
#               harness-mirrors, and cloud-agnostic gates.
#   terraform — fmt + validate on the infra unit (the first slice of #48;
#               plan-level checks need credentials and live there).
name: tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The e2e tests commit in scratch repos and fall back to the global git
      # identity; Actions runners ship none.
      - run: |
          git config --global user.name fleet-ci
          git config --global user.email ci@example.com
      - run: npm test

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One provider cache: the example root and the unit's own tests pull the
    # same provider — one download, not two per unit.
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tf-plugin-cache
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - run: terraform fmt -check -recursive infra/
      # Every infra unit, not a hardcoded one: validate its example and run its
      # own plan-level tests (the #48 smoke — provider-schema constraints that
      # `validate` alone cannot see).
      - run: |
          for unit in infra/*/; do
            terraform -chdir="${unit}examples/basic" init -backend=false -input=false
            terraform -chdir="${unit}examples/basic" validate -no-color
            terraform -chdir="${unit}" init -backend=false -input=false
            terraform -chdir="${unit}" test -no-color
          done
